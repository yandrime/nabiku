<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142A4A" />
      <stop offset="70%" stop-color="#0B1729" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#F5D061" />
      <stop offset="75%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8A6710" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="10 6" />

  <!-- Arabic Text "Muhammad" -->
  <text x="256" y="325" 
        font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', 'Noto Naskh Arabic', 'Geeza Pro', 'Farisi', 'SF Arabic', serif" 
        font-size="230" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)"
        direction="rtl"
        xml:lang="ar">محمد</text>
</svg>
